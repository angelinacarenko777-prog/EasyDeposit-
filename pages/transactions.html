<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout History - EasyDeposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer text-[#1a2b4b]" onclick="location.href='../index.html'">
            <span>EasyDeposit</span>
        </div>
        
        <nav class="hidden md:flex gap-6 font-medium text-slate-600">
            <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="deposits.html" class="hover:text-blue-600 transition">Deposits</a>
            <a href="calculator.html" class="hover:text-blue-600 transition">Calculator</a>
        </nav>

        <div id="auth-group" class="flex gap-3 items-center min-w-[150px] justify-end"></div>
    </header>

    <main class="container mx-auto py-12 px-6 max-w-3xl flex-grow">
        
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-3xl font-black text-[#1a2b4b] mb-1">Transaction History</h2>
                <p class="text-slate-400 text-sm">Monitor your deposits and dynamic payout generation records</p>
            </div>
            <button onclick="clearHistory()" class="text-xs font-bold text-red-400 hover:text-red-600 border border-red-200 hover:border-red-400 px-3 py-1.5 rounded-xl transition bg-white shadow-sm">Clear History</button>
        </div>

        <div class="bg-white rounded-[2rem] p-8 shadow-xl border border-slate-100">
            <div id="transactions-timeline" class="space-y-6">
                </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>

    <script>
        function renderTransactions() {
            const container = document.getElementById('transactions-timeline');

            let savedTransactions = JSON.parse(localStorage.getItem('my_transactions')) || [];

            const savedDeposits = JSON.parse(localStorage.getItem('my_deposits')) || [];
            
            if (savedTransactions.length === 0 && savedDeposits.length > 0) {
                savedTransactions = savedDeposits.map(dep => ({
                    title: `Opened ${dep.plan}`,
                    type: 'investment',
                    amount: dep.amount,
                    date: dep.date || new Date().toLocaleDateString('uk-UA'),
                    time: '00:00'
                }));
                localStorage.setItem('my_transactions', JSON.stringify(savedTransactions));
            }

            if (savedTransactions.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 flex flex-col items-center justify-center">
                        <span class="text-5xl block mb-4">📁</span>
                        <p class="text-slate-400 text-sm italic font-medium">No operations found. Try to open a new deposit contract.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            [...savedTransactions].reverse().forEach(tx => {
                const isInvestment = tx.type === 'investment';
                const sign = isInvestment ? '-' : '+';
                const amountClass = isInvestment ? 'text-red-600' : 'text-green-600';
                const bgIcon = isInvestment ? 'bg-red-50 text-red-600 border-red-100' : 'bg-green-50 text-green-700 border-green-100';

                container.innerHTML += `
                    <div class="flex items-center justify-between p-4 bg-slate-50/50 rounded-2xl border border-slate-100 hover:border-blue-200 transition duration-200 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl border flex items-center justify-center font-bold text-xl ${bgIcon}">
                                ${isInvestment ? '📉' : '💰'}
                            </div>
                            <div>
                                <h4 class="font-bold text-[#1a2b4b] text-base">${tx.title}</h4>
                                <p class="text-xs text-slate-400 font-medium">${tx.date} • ${tx.time}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="font-black text-lg ${amountClass}">${sign}${parseFloat(tx.amount).toLocaleString()} ₴</span>
                            <div class="text-[10px] uppercase font-black text-slate-400 tracking-wider mt-0.5">
                                ${isInvestment ? 'Capital Outflow' : 'Income Payout'}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function clearHistory() {
            if(confirm("Are you sure you want to wipe transaction logs?")) {
                localStorage.removeItem('my_transactions');
                renderTransactions();
            }
        }

        document.addEventListener('DOMContentLoaded', renderTransactions);
    </script>
</body>
</html>
