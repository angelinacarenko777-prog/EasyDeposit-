<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDeposit - Реєстрація</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer" onclick="location.href='../index.html'">
            <img src="../logo.png" alt="logo" class="w-8 h-8">
            <span>EasyDeposit</span>
        </div>
        <nav class="hidden md:flex gap-6 text-slate-600 font-medium">
            <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="deposits.html" class="hover:text-blue-600 transition">Deposits</a>
            <a href="calculator.html" class="hover:text-blue-600 transition">Calculator</a>
        </nav>
        <div id="auth-group"></div>
    </header>

    <div class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-3xl shadow-xl shadow-slate-200 w-full max-w-md text-center border border-slate-100">
            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Create Account</h2>
            <p class="text-slate-400 mb-8">Join EasyDeposit today</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Full Name</label>
                    <input type="text" id="reg-name" placeholder="John Doe" 
                        class="w-full px-5 py-3 rounded-xl border border-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Email Address</label>
                    <input type="email" id="reg-email" placeholder="example@mail.com" 
                        class="w-full px-5 py-3 rounded-xl border border-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Password</label>
                    <input type="password" id="reg-pass" placeholder="••••••••" 
                        class="w-full px-5 py-3 rounded-xl border border-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">
                </div>
                
                <button onclick="register()" id="reg-btn"
                    class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg shadow-blue-100 active:scale-95 mt-4">
                    Sign Up
                </button>
            </div>
            
            <div class="mt-8 space-y-3 border-t border-slate-50 pt-6">
                <p class="text-slate-600 text-sm">
                    Already have an account? <a href="login.html" class="text-blue-600 font-bold hover:underline">Sign In</a>
                </p>
                <a href="../index.html" class="inline-block text-slate-400 text-xs hover:text-slate-600 transition">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>

    <footer class="py-6 text-center text-slate-400 text-sm">
        <p>© EasyDeposit 2026. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://mhcojnzhauelvnvnjelv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_B3iTB_azJexCuA-mw4O5dA_jD7wPZRN';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function register() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const btn = document.getElementById('reg-btn');

            if(!name || !email || !pass) {
                return alert("Будь ласка, заповніть всі поля!");
            }

            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: pass,
                    options: { 
                        data: { full_name: name } 
                    }
                });

                if (error) throw error;

                alert("Успіх! На вашу пошту відправлено лист. Підтвердіть її перед входом.");
                window.location.href = "../index.html";

            } catch (err) {
                alert("Помилка реєстрації: " + err.message);
                btn.innerText = "Sign Up";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
