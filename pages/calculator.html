<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - EasyDeposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer text-[#1a2b4b]" onclick="location.href='../index.html'">
            <img src="../logo.png" alt="logo" class="w-8 h-8"> 
            <span>EasyDeposit</span>
        </div>
        
        <nav class="hidden md:flex gap-6 font-medium text-slate-600">
            <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="deposits.html" class="hover:text-blue-600 transition">Deposits</a>
            <a href="calculator.html" class="text-blue-600 font-bold transition">Calculator</a>
            <a href="analytics.html" class="hover:text-blue-600 transition">Analytics</a>
        </nav>

        <div id="auth-group" class="flex gap-3 items-center min-w-[150px] justify-end"></div>
    </header>

    <main class="container mx-auto py-12 px-6 max-w-6xl flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
        
        <div class="lg:col-span-2 bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100 space-y-8">
            <h2 class="text-3xl font-black text-[#1a2b4b]">Calculate Deposit Income</h2>
            
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <label class="text-xs uppercase font-black text-slate-400 tracking-wider">Deposit Amount</label>
                    <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 font-black text-blue-600 text-lg">
                        <input type="number" id="calc-amount" value="100000" min="10000" max="1000000" step="5000" class="bg-transparent text-right w-24 focus:outline-none">
                        <span class="ml-1">₴</span>
                    </div>
                </div>
                <input type="range" id="range-amount" min="10000" max="1000000" value="100000" step="5000" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <div class="flex justify-between text-[10px] text-slate-400 font-bold">
                    <span>10 000 ₴</span>
                    <span>1 000 000 ₴</span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <label class="text-xs uppercase font-black text-slate-400 tracking-wider">Deposit Term</label>
                    <div class="bg-blue-50 border border-blue-100 text-blue-700 font-black px-4 py-1.5 rounded-xl text-sm shadow-sm">
                        <span id="term-display">12</span> mo
                    </div>
                </div>
                <input type="range" id="range-term" min="3" max="12" value="12" step="3" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <div class="flex justify-between text-[10px] text-slate-400 font-bold px-1">
                    <span>3 MO</span>
                    <span>6 MO</span>
                    <span>9 MO</span>
                    <span>12 MO</span>
                </div>
            </div>

            <hr class="border-slate-100">

            <div class="flex justify-between items-center pt-2">
                <div>
                    <h4 class="text-xs uppercase font-black text-slate-400 tracking-wider mb-1">Interest Rate</h4>
                    <p class="text-xs text-slate-400 font-medium">Fixed rate for the entire term</p>
                </div>
                <div class="text-3xl font-black text-[#1a2b4b]">
                    <span id="rate-display">16.75</span>%
                </div>
            </div>
        </div>

        <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100 flex flex-col justify-between min-h-[420px]">
            <div>
                <h3 class="text-xl font-black text-[#1a2b4b] text-center mb-8">Your Future Income</h3>
                
                <div class="space-y-4 text-sm font-medium text-slate-500 mb-8">
                    <div class="flex justify-between border-b border-slate-50 pb-2">
                        <span>Principal amount:</span>
                        <span class="font-bold text-slate-800" id="res-principal">100 000 ₴</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-50 pb-2">
                        <span>Interest earned:</span>
                        <span class="font-bold text-green-600" id="res-earned">+16 750 ₴</span>
                    </div>
                    <div class="flex justify-between pb-2">
                        <span>Taxes (19.5%):</span>
                        <span class="font-bold text-red-500" id="res-taxes">-3 266 ₴</span>
                    </div>
                </div>

                <div class="bg-green-50/60 border border-green-100 rounded-2xl p-4 text-center">
                    <span class="text-[10px] uppercase font-black text-green-700 tracking-wider block mb-1">Net Profit</span>
                    <div class="text-3xl font-black text-green-600" id="res-net">13 484 ₴</div>
                </div>
            </div>

            <button onclick="redirectToOpen()" class="w-full mt-6 bg-[#1a2b4b] text-white py-4 rounded-xl font-bold hover:bg-blue-950 transition text-center shadow-md active:scale-[0.99]">
                OPEN DEPOSIT
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>

    <script>
        // Динамічна зміна відсоткової ставки залежно від терміну інвестування
        const ratePolicy = {
            3: 12.50,
            6: 14.00,
            9: 15.50,
            12: 16.75
        };

        const inputAmount = document.getElementById('calc-amount');
        const rangeAmount = document.getElementById('range-amount');
        const rangeTerm = document.getElementById('range-term');
        const termDisplay = document.getElementById('term-display');
        const rateDisplay = document.getElementById('rate-display');

        function updateCalculations() {
            let amount = parseFloat(inputAmount.value) || 0;
            let months = parseInt(rangeTerm.value) || 12;
            
            // Запобігаємо виходу за ліміти калькулятора при ручному введенні суми
            if (amount < 10000) amount = 10000;
            if (amount > 1000000) amount = 1000000;

            const rate = ratePolicy[months] || 16.75;

            // Формули фінансового розрахунку
            const interestEarned = amount * (rate / 100) * (months / 12);
            const taxes = interestEarned * 0.195; // 18% ПДФО + 1.5% Військовий збір
            const netProfit = interestEarned - taxes;

            // Оновлення інтерфейсу користувача
            termDisplay.innerText = months;
            rateDisplay.innerText = rate.toFixed(2);
            
            document.getElementById('res-principal').innerText = Math.round(amount).toLocaleString() + ' ₴';
            document.getElementById('res-earned').innerText = '+' + Math.round(interestEarned).toLocaleString() + ' ₴';
            document.getElementById('res-taxes').innerText = '-' + Math.round(taxes).toLocaleString() + ' ₴';
            document.getElementById('res-net').innerText = Math.round(netProfit).toLocaleString() + ' ₴';
        }

        // Зв'язування числових полів та повзунків (двосторонній дата-байндінг)
        rangeAmount.addEventListener('input', (e) => {
            inputAmount.value = e.target.value;
            updateCalculations();
        });

        inputAmount.addEventListener('change', (e) => {
            let val = parseInt(e.target.value) || 10000;
            if(val < 10000) val = 10000;
            if(val > 1000000) val = 1000000;
            inputAmount.value = val;
            rangeAmount.value = val;
            updateCalculations();
        });

        rangeTerm.addEventListener('input', updateCalculations);

        // Перенаправлення на оформлення відповідного тарифного плану
        function redirectToOpen() {
            const months = parseInt(rangeTerm.value);
            let planSlug = 'standard';
            
            if(months === 6) planSlug = 'premium';
            if(months === 9) planSlug = 'vip';
            if(months === 12) planSlug = 'ultra';

            window.location.href = `deposit.html?plan=${planSlug}`;
        }

        // Первинний прорахунок при старті сторінки
        document.addEventListener('DOMContentLoaded', updateCalculations);
    </script>
</body>
</html>
