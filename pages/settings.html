<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - EasyDeposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
        <div class="logo-area font-bold text-xl text-[#1a2b4b] cursor-pointer" onclick="location.href='../index.html'">EasyDeposit</div>
        <div id="auth-group"></div>
    </header>

    <main class="container mx-auto py-12 px-6 max-w-2xl">
        <div class="bg-white p-10 rounded-[3rem] shadow-xl border border-slate-50">
            <h2 class="text-2xl font-black text-[#1a2b4b] mb-2">Security & Settings</h2>
            <p class="text-slate-400 mb-8">Manage your password and profile credentials</p>

            <form id="update-settings-form" class="space-y-6">
                <div>
                    <label class="text-xs font-black uppercase text-slate-400 tracking-wider">Update Full Name</label>
                    <input type="text" id="settings-name" placeholder="New full name">
                </div>
                
                <div class="border-t border-slate-100 pt-6">
                    <label class="text-xs font-black uppercase text-slate-400 tracking-wider">Change Password</label>
                    <input type="password" id="settings-password" placeholder="Enter new password (min 6 characters)">
                </div>

                <button type="submit" class="action-btn">
                    Save Changes
                </button>
            </form>
            <div id="settings-msg" class="mt-4 text-center text-sm font-bold hidden"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('update-settings-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('settings-name').value.trim();
            const password = document.getElementById('settings-password').value.trim();
            const msg = document.getElementById('settings-msg');

            let updates = {};
            if (name) updates.data = { full_name: name };
            if (password) updates.password = password;

            if (Object.keys(updates).length === 0) return;

            const { error } = await supabaseClient.auth.updateUser(updates);

            msg.classList.remove('hidden', 'text-red-500', 'text-green-500');
            if (error) {
                msg.innerText = "Error: " + error.message;
                msg.classList.add('text-red-500');
            } else {
                msg.innerText = "Settings updated successfully!";
                msg.classList.add('text-green-500');
                document.getElementById('update-settings-form').reset();
            }
        };
    </script>
</body>
</html>
