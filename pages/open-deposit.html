<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>EasyDeposit - Confirmation</title>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo font-bold text-xl text-[#1a2b4b] cursor-pointer" onclick="location.href='../index.html'">EasyDeposit</div>
        <div id="auth-group"></div>
    </header>

    <main class="container mx-auto flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-lg border border-slate-50 text-center">
            <h2 class="text-3xl font-black text-[#1a2b4b] mb-2">Almost Ready!</h2>
            <p class="text-slate-400 mb-8">Please confirm your selected deposit conditions</p>
            
            <form id="final-step-form" class="space-y-8">
                <div id="deposit-summary" class="bg-blue-50 p-6 rounded-3xl text-sm text-blue-800 font-medium">
                    <div class="animate-pulse">Loading conditions...</div>
                </div>

                <button type="submit" class="w-full bg-[#1a2b4b] text-white py-5 rounded-2xl font-bold text-lg hover:bg-blue-900 transition uppercase tracking-widest active:scale-95 shadow-lg">
                    Open Online
                </button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script>
        const pending = JSON.parse(localStorage.getItem('pendingDeposit'));
        
        if (pending && document.getElementById('deposit-summary')) {
            document.getElementById('deposit-summary').innerHTML = `
                You selected: <span class="font-bold text-blue-600">${pending.amount.toLocaleString()} ₴</span> 
                for <span class="font-bold text-blue-600">${pending.term} months</span> 
                at <span class="font-bold text-blue-600">${pending.rate}%</span>
            `;
        } else {
            document.getElementById('deposit-summary').innerHTML = `<span class="text-red-500 font-medium">Deposit data not found. Please calculate your conditions again.</span>`;
        }

        document.getElementById('final-step-form').onsubmit = async (e) => {
            e.preventDefault();
            
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session || !session.user) {
                alert("Please log in to open a deposit!");
                window.location.href = 'login.html';
                return;
            }

            if (!pending) {
                alert("Deposit data missing. Please recalculate.");
                window.location.href = 'calculator.html';
                return;
            }

            const { error } = await supabaseClient
                .from('deposits')
                .insert([
                    { 
                        user_id: session.user.id, 
                        amount: pending.amount, 
                        term: pending.term, 
                        rate: pending.rate 
                    }
                ]);

            if (error) {
                alert("Error saving deposit: " + error.message);
            } else {
                alert("Success! Your deposit has been created.");
                localStorage.removeItem('pendingDeposit');
                window.location.href = 'profile.html';
            }
        };
    </script>
</body>
</html>
