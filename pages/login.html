<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>EasyDeposit - Вхід</title>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer text-[#1a2b4b]" onclick="location.href='../index.html'">
            <img src="../logo.png" alt="logo" class="w-8 h-8">
            <span>EasyDeposit</span>
        </div>
        <nav class="hidden md:flex gap-6 font-medium text-slate-600">
            <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="deposits.html" class="hover:text-blue-600 transition">Deposits</a>
            <a href="calculator.html" class="hover:text-blue-600 transition">Calculator</a>
        </nav>
        <div id="auth-group"></div>
    </header>

    <div class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl shadow-slate-200 w-full max-w-md text-center border border-slate-100">
            <h2 class="text-3xl font-extrabold text-[#1a2b4b] mb-2">Sign In</h2>
            <p class="text-slate-400 mb-8 italic">Welcome back! Please login to your account.</p>
            
            <div class="space-y-4">
                <input type="email" id="log-email" placeholder="Email Address" 
                    class="w-full px-6 py-4 rounded-2xl border border-slate-200 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition text-lg">
                
                <input type="password" id="log-pass" placeholder="Password" 
                    class="w-full px-6 py-4 rounded-2xl border border-slate-200 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition text-lg">
                
                <button id="log-btn" onclick="login()" 
                    class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition shadow-lg active:scale-95 mt-4">
                    Login
                </button>
            </div>
            
            <div class="mt-8 space-y-3 border-t border-slate-50 pt-6">
                <p class="text-sm">
                    <a href="register.html" class="text-blue-600 font-bold hover:underline">
                        Don't have an account? Sign Up
                    </a>
                </p>
                <a href="../index.html" class="inline-block text-slate-400 text-xs hover:text-slate-600 transition">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>

    <footer class="py-8 text-center text-slate-400 text-sm">
        <p>© EasyDeposit 2026. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>

    <script>
        // Використовуємо клієнт supabaseClient, який вже створений в auth.js
        async function login() {
            const email = document.getElementById('log-email').value;
            const pass = document.getElementById('log-pass').value;
            const btn = document.getElementById('log-btn');

            if (!email || !pass) return alert("Please fill all fields!");

            btn.innerText = "Checking...";
            btn.disabled = true;

            try {
                // Використовуємо реальну авторизацію Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: pass,
                });

                if (error) throw error;

                // Якщо успішно — перенаправляємо на головну
                window.location.href = "../index.html";
            } catch (err) {
                alert("Error: " + err.message);
                btn.innerText = "Login";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
