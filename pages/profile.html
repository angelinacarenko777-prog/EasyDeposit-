<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EasyDeposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer text-[#1a2b4b]" onclick="location.href='../index.html'">
            <img src="../logo.png" alt="logo" class="w-8 h-8"> 
            <span>EasyDeposit</span>
        </div>
        
        <nav class="hidden md:flex gap-6 font-medium text-slate-600">
            <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="deposits.html" class="hover:text-blue-600 transition">Deposits</a>
            <a href="calculator.html" class="hover:text-blue-600 transition">Calculator</a>
            <a href="analytics.html" class="hover:text-blue-600 transition">Analytics</a>
            <a href="contacts.html" class="hover:text-blue-600 transition">Contacts</a>
        </nav>

        <div id="auth-group" class="flex gap-3 items-center min-w-[150px] justify-end"></div>
    </header>

    <main class="container mx-auto py-12 px-6 max-w-6xl flex-grow">
        
        <div class="flex items-center gap-6 mb-10 p-6 bg-white rounded-3xl shadow-sm border border-slate-100">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center font-black text-2xl shadow-lg" id="profile-avatar">U</div>
            <div>
                <h2 class="text-3xl font-black text-[#1a2b4b]" id="profile-name">Loading...</h2>
                <p class="text-slate-400" id="profile-email">email@example.com</p>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
            <a href="analytics.html" class="flex items-center justify-between p-4 bg-white hover:bg-blue-50/50 border border-slate-200 hover:border-blue-300 rounded-2xl transition group shadow-sm">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📈</span>
                    <span class="font-bold text-[#1a2b4b] group-hover:text-blue-600">View Analytics</span>
                </div>
                <span class="text-slate-300 group-hover:text-blue-500 font-bold">➔</span>
            </a>

            <a href="transactions.html" class="flex items-center justify-between p-4 bg-white hover:bg-blue-50/50 border border-slate-200 hover:border-blue-300 rounded-2xl transition group shadow-sm">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">💸</span>
                    <span class="font-bold text-[#1a2b4b] group-hover:text-blue-600">Payout History</span>
                </div>
                <span class="text-slate-300 group-hover:text-blue-500 font-bold">➔</span>
            </a>

            <a href="settings.html" class="flex items-center justify-between p-4 bg-white hover:bg-blue-50/50 border border-slate-200 hover:border-blue-300 rounded-2xl transition group shadow-sm">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">⚙️</span>
                    <span class="font-bold text-[#1a2b4b] group-hover:text-blue-600">Security Settings</span>
                </div>
                <span class="text-slate-300 group-hover:text-blue-500 font-bold">➔</span>
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-50 flex flex-col justify-between min-h-[300px]">
                <div>
                    <h3 class="text-xl font-black text-[#1a2b4b] mb-4 flex items-center gap-2">💳 My Bank Cards</h3>
                    <div id="cards-list" class="space-y-3 mb-6"></div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="card-number-input" placeholder="3456 7898 7687 2345" maxlength="19" class="w-full px-4 py-3 rounded-xl border border-slate-200 font-mono text-sm focus:outline-none focus:border-blue-500 bg-slate-50">
                    <button onclick="addNewCard()" class="px-6 py-3 bg-[#1a2b4b] text-white rounded-xl font-bold hover:bg-blue-900 transition">Add</button>
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-50">
                <h3 class="text-xl font-black text-[#1a2b4b] mb-4 flex items-center gap-2">📈 My Deposit Requests</h3>
                <div id="deposits-list" class="space-y-4">
                    <p class="text-slate-400 text-sm italic py-4">Loading deposits...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        let cardStorageKey = '';
        let currentUserEmail = '';

        async function initDashboard() {
            try {
                if (typeof supabaseClient !== 'undefined') {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session && session.user) {
                        const name = session.user.user_metadata?.full_name || 'Investor';
                        document.getElementById('profile-name').innerText = name;
                        currentUserEmail = session.user.email;
                        document.getElementById('profile-email').innerText = currentUserEmail;
                        document.getElementById('profile-avatar').innerText = name[0].toUpperCase();
                        
                        cardStorageKey = `my_cards_${currentUserEmail}`;
                    } else {
                        window.location.href = 'login.html';
                        return;
                    }
                }
            } catch (e) { console.error(e); }
            
            renderDepositsFromSupabase();
            renderCards();
        }

        async function renderDepositsFromSupabase() {
            const listContainer = document.getElementById('deposits-list');
            if (!listContainer) return;

            try {
                const { data: requests, error } = await supabaseClient
                    .from('contact_requests')
                    .select('*')
                    .eq('user_email', currentUserEmail);

                if (error) {
                    listContainer.innerHTML = `<p class="text-red-500 text-sm py-4">Error: ${error.message}</p>`;
                    return;
                }

                if (!requests || requests.length === 0) {
                    listContainer.innerHTML = `<p class="text-slate-400 text-sm italic py-4">No deposits found.</p>`;
                    return;
                }

                listContainer.innerHTML = '';
                
                [...requests].reverse().forEach(dep => {
                    let formattedDate = '21.05.2026';
                    if (dep.created_at) {
                        formattedDate = new Date(dep.created_at).toLocaleDateString('uk-UA');
                    }

                    const depositAmount = dep.amount ? parseFloat(dep.amount) : 0;

                    let rateText = '12%';
                    if (dep.plan_name === 'Standard') rateText = '10%';
                    else if (dep.plan_name === 'Premium') rateText = '15%';
                    else if (dep.plan_name === 'VIP') rateText = '20%';
                    else if (dep.plan_name === 'Ultra Stealth') rateText = '25%';

                    listContainer.innerHTML += `
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center">
                            <div>
                                <div class="font-bold text-[#1a2b4b]">${dep.plan_name} Plan</div>
                                <div class="text-xs text-slate-400 font-medium">Rate: ${rateText} • ${formattedDate}</div>
                            </div>
                            <div class="text-right">
                                <div class="font-black text-slate-800 text-lg">${depositAmount.toLocaleString()} ₴</div>
                                <span class="inline-block text-[10px] px-2 py-0.5 rounded-full font-bold bg-green-100 text-green-700 mt-1">Active</span>
                            </div>
                        </div>`;
                });

            } catch (err) {
                listContainer.innerHTML = `<p class="text-slate-400 text-sm italic py-4">No deposits found.</p>`;
            }
        }

        function renderCards() {
            const cardsContainer = document.getElementById('cards-list');
            if (!cardsContainer) return;

            const savedCards = JSON.parse(localStorage.getItem(cardStorageKey)) || [];
            
            if (savedCards.length === 0) {
                cardsContainer.innerHTML = `<p class="text-slate-400 text-sm italic py-4">No cards linked.</p>`;
                return;
            }
            cardsContainer.innerHTML = '';
            savedCards.forEach((card, index) => {
                cardsContainer.innerHTML += `
                    <div class="p-4 bg-gradient-to-r from-slate-800 to-slate-900 rounded-xl flex justify-between items-center text-white shadow-md relative overflow-hidden">
                        <div class="z-10">
                            <div class="text-xs text-slate-400 font-semibold tracking-wider">Linked Card</div>
                            <div class="font-mono text-base font-bold mt-1 tracking-widest">${card}</div>
                        </div>
                        <button onclick="deleteCard(${index})" class="text-slate-400 hover:text-red-400 font-bold text-sm z-10 transition">✕</button>
                    </div>`;
            });
        }

        function addNewCard() {
            const input = document.getElementById('card-number-input');
            const rawValue = input.value.trim();
            if (rawValue.replace(/\s/g, '').length < 12) { return alert("Invalid card number!"); }
            
            let savedCards = JSON.parse(localStorage.getItem(cardStorageKey)) || [];
            savedCards.push(rawValue);
            localStorage.setItem(cardStorageKey, JSON.stringify(savedCards));
            
            input.value = '';
            renderCards();
        }

        function deleteCard(index) {
            let savedCards = JSON.parse(localStorage.getItem(cardStorageKey)) || [];
            savedCards.splice(index, 1);
            localStorage.setItem(cardStorageKey, JSON.stringify(savedCards));
            renderCards();
        }

        document.getElementById('card-number-input').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
