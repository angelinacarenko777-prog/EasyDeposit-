<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Мій профіль - EasyDeposit</title>
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer text-[#1a2b4b]" onclick="location.href='../index.html'">
            <img src="../logo.png" alt="logo" class="w-8 h-8"> EasyDeposit
        </div>
        <nav class="hidden md:flex gap-6 font-medium text-slate-600">
            <a href="../index.html" class="hover:text-blue-600">Home</a>
            <a href="deposits.html" class="hover:text-blue-600">Deposits</a>
            <a href="calculator.html" class="hover:text-blue-600">Calculator</a>
        </nav>
        <div id="auth-group" class="flex items-center gap-3"></div>
    </header>

    <main class="container mx-auto py-12 px-6">
        <div class="flex items-center gap-6 mb-12 ml-4">
            <div id="user-avatar" class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center text-white text-4xl font-black shadow-xl shadow-blue-200">
                ?
            </div>
            <div>
                <h2 id="user-display-name" class="text-4xl font-black text-[#1a2b4b]">Завантаження...</h2>
                <p id="user-display-email" class="text-slate-400 font-medium"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-10 rounded-[3rem] shadow-xl border border-slate-50">
                <h3 class="text-xl font-bold text-[#1a2b4b] mb-6 flex items-center gap-2">
                    💳 My Bank Cards
                </h3>
                <div class="text-slate-400 italic mb-8">No cards added</div>
                <div class="flex gap-2">
                    <input type="text" placeholder="0000 0000 0000 0000" class="flex-grow bg-slate-50 border border-slate-100 px-6 py-4 rounded-2xl outline-none focus:border-blue-500">
                    <button class="bg-[#1a2b4b] text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-900 transition">Add</button>
                </div>
            </div>

            <div class="bg-white p-10 rounded-[3rem] shadow-xl border border-slate-50">
                <h3 class="text-xl font-bold text-[#1a2b4b] mb-6 flex items-center gap-2">
                    📈 My Deposit Requests
                </h3>
                <div id="deposits-container" class="space-y-4">
                    <div class="animate-pulse text-slate-300">Шукаємо ваші депозити...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script>
        async function initProfile() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Оновлюємо інфо про юзера
            const name = user.user_metadata?.full_name || user.email.split('@')[0];
            document.getElementById('user-display-name').innerText = name;
            document.getElementById('user-display-email').innerText = user.email;
            document.getElementById('user-avatar').innerText = name[0].toUpperCase();

            // ЗАВАНТАЖУЄМО ДЕПОЗИТИ
            loadUserDeposits(user.id);
        }

        async function loadUserDeposits(userId) {
            const container = document.getElementById('deposits-container');

            const { data: deposits, error } = await supabaseClient
                .from('deposits')
                .select('*')
                .eq('user_id', userId)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="text-red-400 text-sm">Помилка завантаження: ${error.message}</div>`;
                return;
            }

            if (!deposits || deposits.length === 0) {
                container.innerHTML = `<div class="text-slate-400 italic text-center py-4">У вас поки немає активних заявок.</div>`;
                return;
            }

            // Рендеримо кожен депозит
            container.innerHTML = deposits.map(dep => `
                <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 flex justify-between items-center hover:border-blue-200 transition">
                    <div>
                        <div class="text-[10px] font-black uppercase text-blue-600 tracking-widest mb-1">Депозит Активний</div>
                        <div class="text-2xl font-black text-[#1a2b4b]">${dep.amount.toLocaleString()} ₴</div>
                        <div class="text-xs text-slate-400 font-medium">${dep.term} місяців під ${dep.rate}%</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] font-bold text-slate-300 uppercase">${new Date(dep.created_at).toLocaleDateString()}</div>
                        <div class="mt-2 text-green-500 font-bold text-xs flex items-center gap-1 justify-end">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> В роботі
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', initProfile);
    </script>
</body>
</html>
