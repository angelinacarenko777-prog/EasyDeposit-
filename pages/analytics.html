<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - EasyDeposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer text-[#1a2b4b]" onclick="location.href='../index.html'">
            <img src="../logo.png" alt="logo" class="w-8 h-8"> 
            <span>EasyDeposit</span>
        </div>
        
        <nav class="hidden md:flex gap-6 font-medium text-slate-600">
            <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="deposits.html" class="hover:text-blue-600 transition">Deposits</a>
            <a href="calculator.html" class="hover:text-blue-600 transition">Calculator</a>
            <a href="analytics.html" class="hover:text-blue-600 transition">Analytics</a>
        </nav>

        <div id="auth-group" class="flex gap-3 items-center min-w-[150px] justify-end"></div>
    </header>

    <main class="container mx-auto py-12 px-6 max-w-5xl">
        <h2 class="text-3xl font-black text-[#1a2b4b] mb-2">Investment Analytics</h2>
        <p class="text-slate-400 mb-8">Track your portfolio growth statistics dynamically</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                <div class="text-xs font-bold text-slate-400 uppercase mb-1">Active Capital</div>
                <div class="text-3xl font-black text-[#1a2b4b]">890,000 ₴</div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                <div class="text-xs font-bold text-slate-400 uppercase mb-1">Estimated Annual Profit</div>
                <div class="text-3xl font-black text-green-500">+140,175 ₴</div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                <div class="text-xs font-bold text-slate-400 uppercase mb-1">Average Rate</div>
                <div class="text-3xl font-black text-blue-600">15.75%</div>
            </div>
        </div>

        <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-50">
            <h3 class="font-bold text-lg text-[#1a2b4b] mb-6">Profit Growth Forecast (12 Months)</h3>
            <div class="w-full h-[300px]">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script>
        const ctx = document.getElementById('analyticsChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: 'Expected Profit Accumulation (₴)',
                    data: [0, 11600, 23200, 34800, 46400, 58000, 69600, 81200, 92800, 104400, 116000, 140175],
                    borderColor: '#6385cd',
                    backgroundColor: 'rgba(99, 133, 205, 0.1)',
                    borderWidth: 4,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { grid: { display: false } }, x: { grid: { display: false } } }
            }
        });
    </script>
</body>
</html>
