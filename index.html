<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDeposit | Smart Investing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="logo-area flex items-center gap-2 font-bold text-xl cursor-pointer text-[#1a2b4b]" onclick="location.href='index.html'">
            <img src="logo.png" alt="logo" class="w-8 h-8"> 
            <span>EasyDeposit</span>
        </div>
        
<nav class="hidden md:flex gap-6 font-medium text-slate-600">
    <a href="index.html" class="text-blue-600 font-bold transition">Home</a>
    <a href="pages/deposits.html" class="hover:text-blue-600 transition">Deposits</a>
    <a href="pages/calculator.html" class="hover:text-blue-600 transition">Calculator</a>
    <a href="pages/analytics.html" class="hover:text-blue-600 transition">Analytics</a>
    <a href="pages/contacts.html" class="hover:text-blue-600 transition">Contacts</a>
</nav>

        <div id="auth-group" class="flex gap-3 items-center min-w-[150px] justify-end"></div>
    </header>

    <main class="container mx-auto flex-grow flex flex-col justify-center items-center py-20 px-4 text-center">
        <h1 class="text-5xl md:text-6xl font-extrabold text-[#1a2b4b] mb-6 leading-tight">
            Welcome to <span class="text-blue-600">EasyDeposit</span>
        </h1>
        <p class="text-lg md:text-xl text-slate-500 mb-10">
            Start your investing journey today. Choose a plan and grow your capital.
        </p>
        <button onclick="location.href='pages/deposits.html'" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-lg active:scale-95">
            Get Started
        </button>
    </main>

    <footer class="bg-white border-t border-slate-100 py-10 text-center">
        <p class="text-slate-400 mb-4">© EasyDeposit 2026. All rights reserved.</p>
        <div class="flex justify-center gap-6 font-bold text-blue-600 text-sm">
            <a href="#" class="hover:text-[#1a2b4b]">Instagram</a>
            <a href="#" class="hover:text-[#1a2b4b]">Telegram</a>
            <a href="#" class="hover:text-[#1a2b4b]">Facebook</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Спрощена і чиста функція оновлення UI, що використовує глобальний клієнт з auth.js
        async function updateUI() {
            const group = document.getElementById('auth-group');
            if (!group) return;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (session && session.user) {
                    const name = session.user.user_metadata?.full_name || 'User';
                    group.innerHTML = `
                        <div class="flex items-center gap-4 animate-in fade-in duration-300">
                            <a href="pages/profile.html" class="flex items-center gap-2 group no-underline">
                                <span class="font-bold text-slate-700 group-hover:text-blue-600 transition">Hi, ${name}</span>
                                <div class="w-9 h-9 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold border-2 border-white shadow-md">
                                    ${name[0].toUpperCase()}
                                </div>
                            </a>
                            <button onclick="logout()" class="px-3 py-1.5 bg-slate-100 text-slate-500 hover:bg-red-50 hover:text-red-600 rounded-xl transition text-xs font-bold uppercase">
                                Exit
                            </button>
                        </div>
                    `;
                } else {
                    group.innerHTML = `
                        <div class="flex items-center gap-3">
                            <a href="pages/login.html" class="px-4 py-2 text-slate-600 font-bold hover:text-blue-600 transition text-sm no-underline">Sign In</a>
                            <a href="pages/register.html" class="px-6 py-2 bg-[#1a2b4b] text-white rounded-xl font-bold shadow-lg hover:bg-blue-800 transition text-sm no-underline">Join</a>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("UI Update Error:", err);
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
